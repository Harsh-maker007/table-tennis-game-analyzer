services:
  - type: web
    name: table-tennis-backend
    runtime: python
    rootDir: table-tennis-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free

  - type: web
    name: table-tennis-frontend
    runtime: static
    rootDir: table-tennis-ai/frontend
    staticPublishPath: .
    buildCommand: ""
